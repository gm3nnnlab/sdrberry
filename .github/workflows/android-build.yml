name: Build Android App (Chornobyl HamDash)

on:
  push:
    branches:
      - '**'
    paths:
      - 'android/ChornobylHamDash/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches:
      - '**'
    paths:
      - 'android/ChornobylHamDash/**'
      - '.github/workflows/android-build.yml'

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Gradle Build, Lint & Unit Tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android/ChornobylHamDash

    steps:
      # 1. Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up JDK 17 (matches app/build.gradle.kts compileOptions/kotlinOptions)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Validate the Gradle wrapper jar against Gradle's published checksums
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # 4. GitHub's ubuntu-24.04 runner image ships a pre-installed Android SDK
      #    (cmdline-tools + ANDROID_HOME already set) — no setup action needed.
      #    Accept licenses defensively, then install the platform and build-tools
      #    this project targets (compileSdk = 34); both are no-ops if already present.
      - name: Install SDK platform 34 + build-tools
        run: |
          SDKMANAGER="$(command -v sdkmanager || compgen -G "$ANDROID_HOME/cmdline-tools/*/bin/sdkmanager" | head -n1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      # 5. Make gradlew executable (some checkouts/zip exports drop the +x bit)
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 6. Unit tests (app/src/test)
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # 7. Static analysis
      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace

      # 8. Build the debug APK
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 9. Publish the APK so it can be downloaded from the run
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ChornobylHamDash-debug-apk
          path: android/ChornobylHamDash/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 10. Publish test/lint reports (even on failure, for debugging)
      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChornobylHamDash-reports
          path: |
            android/ChornobylHamDash/app/build/reports/tests/
            android/ChornobylHamDash/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
